<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>FIND.INC 공유 썸네일 원본</title>
<style>
@font-face{font-family:Studio;src:url('{{FONT}}');font-weight:100 900;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}body{font-family:Studio,"Malgun Gothic",sans-serif;background:#10192b;color:#fff}
body.square{height:1200px}.canvas{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 90%,#314873 0,transparent 60%),linear-gradient(135deg,#111827,#111d32 65%,#19273f)}
.ring{position:absolute;left:50%;top:48%;width:850px;height:850px;border:1px solid #b4c9f514;border-radius:50%;transform:translate(-50%,-50%)}.ring:after{content:"";position:absolute;inset:105px;border:1px solid #b4c9f514;border-radius:50%}.ring:before{content:"";position:absolute;inset:-110px;border:1px dashed #b4c9f511;border-radius:50%}
.dots{position:absolute;inset:0;opacity:.18;background-image:radial-gradient(#95b6f0 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(90deg,#000,transparent 32%,transparent 68%,#000)}
.core{position:absolute;left:50%;top:50%;width:574px;height:566px;transform:translate(-50%,-50%);text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:650;letter-spacing:.09em;margin:7px 0 26px}.mark{display:grid;grid-template-columns:repeat(2,6px);gap:3px;transform:rotate(-10deg)}.mark i{width:6px;height:6px;border-radius:1px;background:#eaf1ff}.mark i:last-child{background:#70a6ff}
.eyebrow{color:#9dbaff;font-size:12px;font-weight:600;letter-spacing:.16em;margin:0 0 12px}
h1{margin:0;font-size:54px;font-weight:650;line-height:1.22;letter-spacing:-.045em}h1 span{background:linear-gradient(110deg,#b3ceff,#d7c8ff);background-clip:text;color:transparent}
.subline{margin:15px 0 0;color:#c0cee3;font-size:17px;letter-spacing:-.025em}
.products{display:flex;gap:16px;margin:27px 12px 0;text-align:left}
.product{width:267px;overflow:hidden;border:1px solid #ffffff22;border-radius:17px;background:#ffffff0b;box-shadow:0 18px 40px #0002}
.photo{position:relative;height:137px;overflow:hidden;background:#e2e1dd}.photo img{position:absolute;display:block;max-width:none}.photo.bmw img{width:370px;height:162px;object-fit:cover;left:-103px;top:-9px}.photo.lg{background:#fff}.photo.lg img{width:215px;height:215px;left:26px;top:-50px}
.product-info{height:59px;padding:11px 14px;display:flex;align-items:center;gap:10px}.logo{width:27px;height:27px;object-fit:contain}.lg-logo{width:66px;height:23px;object-fit:contain;background:white;border-radius:4px;padding:3px}
.product-name{font-size:14px;font-weight:550;letter-spacing:-.02em;color:#f0f4ff;white-space:nowrap}.product-name small{display:block;font-size:10px;color:#9aabc5;font-weight:450;letter-spacing:.04em;margin-top:2px}
.footer{margin:23px 0 0;color:#90a3bf;font-size:12px;letter-spacing:.07em}.footer b{color:#d2def1;font-weight:500;margin:0 7px}
.square .core{transform:translate(-50%,-50%) scale(1.72)}.square .ring{width:1120px;height:1120px}.square .dots{mask-image:radial-gradient(ellipse,transparent 35%,#000)}
</style></head><body><main class="canvas"><div class="ring"></div><div class="dots"></div><section class="core"><div class="brand"><span class="mark"><i></i><i></i><i></i><i></i></span>FIND.INC</div><p class="eyebrow">AI NATIVE MARKETING STUDIO</p><h1>브랜드에서<br><span>전략까지, 한눈에.</span></h1><p class="subline">조사 근거로 찾는 브랜드의 다음 전략</p><div class="products"><article class="product"><div class="photo bmw"><img src="{{BMW_IMAGE}}" alt="BMW X5 G65"></div><div class="product-info"><img class="logo" src="{{BMW_LOGO}}" alt="BMW"><div class="product-name">BMW X5<small>BRAND &amp; PRODUCT RESEARCH</small></div></div></article><article class="product"><div class="photo lg"><img src="{{LG_IMAGE}}" alt="LG 퓨리케어 공기청정기"></div><div class="product-info"><img class="lg-logo" src="{{LG_LOGO}}" alt="LG Electronics"><div class="product-name">퓨리케어<small>BRAND &amp; PRODUCT RESEARCH</small></div></div></article></div><p class="footer">브랜드 <b>·</b> 상품 <b>·</b> 경쟁사 <b>·</b> 고객 <b>·</b> 마케팅 전략</p></section></main></body></html>
